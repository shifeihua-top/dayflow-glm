name: Build Dayflow GLM

on:
  push:
    branches: [main]
  schedule:
    # 每周一 02:00 UTC（北京时间周一上午 10 点）自动同步上游
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  # 定时/手动触发时：先尝试合并上游 JerryZLiu/Dayflow 的更新。
  # 合并冲突时此 job 失败，build 被跳过——需要本地跑 scripts/sync-upstream.sh 手动解决。
  sync-upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git remote add upstream https://github.com/JerryZLiu/Dayflow.git
          git fetch upstream main --tags
          git config user.name "glm-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge upstream/main --no-edit || {
            echo "::error::上游合并冲突。请在本地运行 scripts/sync-upstream.sh 手动解决后推送。"
            exit 1
          }
      - name: Push merged main
        run: git push origin main

  build:
    needs: [sync-upstream]
    if: always() && (github.event_name == 'push' || needs.sync-upstream.result == 'success')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XC_PATH"
          sudo xcode-select -s "$XC_PATH"
          xcodebuild -version

      - name: Import stable signing identity
        env:
          GLM_SIGNING_P12_BASE64: ${{ secrets.GLM_SIGNING_P12_BASE64 }}
          GLM_SIGNING_PASSWORD: ${{ secrets.GLM_SIGNING_PASSWORD }}
          GLM_KEYCHAIN_PASSWORD: ${{ secrets.GLM_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$GLM_SIGNING_P12_BASE64" ]; then
            echo " No signing secret — will fall back to ad-hoc"
            echo "GLM_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$GLM_SIGNING_P12_BASE64" | base64 --decode > /tmp/glm-signing.p12
          security create-keychain -p "$GLM_KEYCHAIN_PASSWORD" glm.keychain
          security list-keychains -s glm.keychain $(security list-keychains | tr -d '"' | tr '\n' ' ')
          security unlock-keychain -p "$GLM_KEYCHAIN_PASSWORD" glm.keychain
          security import /tmp/glm-signing.p12 -k glm.keychain -P "$GLM_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$GLM_KEYCHAIN_PASSWORD" glm.keychain
          security find-identity -v -p codesigning glm.keychain
          rm /tmp/glm-signing.p12
          echo "GLM_IDENTITY=Dayflow GLM" >> "$GITHUB_ENV"

      - name: Build app (code signing disabled)
        run: |
          xcodebuild \
            -project Dayflow/Dayflow.xcodeproj \
            -scheme Dayflow \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            POSTHOG_API_KEY="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build

      - name: Sign with stable identity (fallback ad-hoc)
        run: |
          APP="build/Build/Products/Release/Dayflow.app"
          codesign --force --deep --sign "${GLM_IDENTITY:--}" "$APP"
          codesign --verify --deep --strict "$APP" && echo "signature OK"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|flags" || true

      - name: Package DMG and zip
        run: |
          APP="build/Build/Products/Release/Dayflow.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          DMG="Dayflow-${VERSION}-glm.dmg"
          ZIP="Dayflow-${VERSION}-glm.app.zip"
          hdiutil create -volname "Dayflow ${VERSION} GLM" -srcfolder "$APP" -ov -format UDZO "$DMG"
          zip -qry "$ZIP" "$APP"
          ls -lh "$DMG" "$ZIP"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-glm-macos
          path: |
            *.dmg
            *.app.zip
          if-no-files-found: error
